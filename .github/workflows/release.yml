# Installer builds only on a version tag — `npm run installer` takes minutes and produces
# something nobody wants for a branch push. `npm version <patch|minor|major>` makes the
# matching tag; `git push --follow-tags` fires this.
#
# The Release is left as a draft: the NSIS installer is unsigned (Authenticode-wise — the
# `.sig` file below is tauri-plugin-updater's own unrelated Ed25519 signature), so
# publishing is a deliberate act, not a side effect of tagging. That draft gate doubles as
# the in-app updater's rollout gate: `releases/latest/download/latest.json` 404s until a
# human publishes.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run installer
        env:
          # Signs the updater artifact (`createUpdaterArtifacts` in tauri.conf.json), not
          # the exe itself — see the draft-gate comment above.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Assets: the NSIS installer and its updater `.sig`, the bare exe for people who
      # don't want an installer (renamed to carry the version — cargo names it after the
      # crate, dockl.exe, which says nothing about that), and latest.json — the manifest
      # tauri-plugin-updater polls, hand-built here since this workflow doesn't use
      # tauri-action.
      - run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Copy-Item src-tauri/target/release/dockl.exe "Dockl_${version}_x64.exe"

          $setup = Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe
          $sig = Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          $signature = (Get-Content $sig -Raw).Trim()

          @{
            version   = $version
            notes     = ""
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                url       = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$($setup.Name)"
                signature = $signature
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM latest.json

          gh release create $env:GITHUB_REF_NAME --draft --title $env:GITHUB_REF_NAME --generate-notes `
            $setup $sig "Dockl_${version}_x64.exe" latest.json
        env:
          GH_TOKEN: ${{ github.token }}
