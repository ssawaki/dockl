[package]
name = "dockl"
version = "0.1.0"
description = "Native Windows 11 GUI for Docker running inside WSL2"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dockl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
window-vibrancy = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
bollard = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
# The dial-stdio transport speaks HTTP/1.1 directly over a child process's stdio, which
# `reqwest` can't do (it only dials TCP/TLS). These are already in the lock file via
# `reqwest` itself, so naming them here pins no new versions.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
serde_urlencoded = "0.7"
portable-pty = "0.8"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"

